io:
     jobname: 'prospect_cpl_cmb_only_omegam_Om'
     write: True
     dir: 'runs/prospect/2026-08-10_cpl_cmb_only_omegam_Om'
     overwrite_dir: True
     snapshot_interval: 60.0

run:
     jobtype: 'profile'
     mode: 'serial'

kernel:
     type: 'cobaya'
     param: 'configs/cobaya/cpl_cmb_only_omegam.yaml'

profile:
    parameter: 'Omega_m'
    values: 'np.linspace(0.20, 0.45, 8)'

    optimiser: 'simulated annealing'

    temperature_schedule: 'exponential'
    temperature_range: [0.1, 0.001]
    max_iterations: 15

    step_size_schedule: 'adaptive'
    step_size_adaptive_interval: [0.19, 0.21]
    step_size_adaptive_multiplier: 0.3
    step_size_adaptive_initial: 0.1

    steps_per_iteration: 500
    repetitions: 2

    start_from_mcmc: 'runs/cobaya/2026-08-10_cpl_cmb_only_omegam/cpl_cmb_only_omegam'
    start_bin_fraction: 0.1

    plot_profile: True
    detailed_plot: False
    plot_Delta_chi2: True
    plot_schedule: True

    confidence_levels: [0.68, 0.95]
